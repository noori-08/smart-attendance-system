<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Registration</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(10, 15, 35, 0.85),
                    rgba(10, 15, 35, 0.95)
                ),
                linear-gradient(
                    135deg,
                    #182848,
                    #4b6cb7
                );

            color: white;
        }

        .register-box {

            width: 420px;

            padding: 35px;

            border-radius: 18px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(12px);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.4);

        }

        h1 {

            text-align: center;

            margin-bottom: 8px;

        }

        .subtitle {

            text-align: center;

            color: #cfd6ff;

            margin-bottom: 28px;

            font-size: 14px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;
        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: none;

            border-radius: 9px;

            outline: none;

            background: rgba(255, 255, 255, 0.12);

            color: white;

            font-size: 15px;
        }

        input::placeholder {

            color: #c5c9d8;
        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background: #4b7bec;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        button:hover {

            background: #3867d6;
        }

        #otpSection {

            display: none;

            margin-top: 20px;

            padding-top: 20px;

            border-top: 1px solid rgba(255,255,255,0.2);
        }

        #message {

            text-align: center;

            margin-top: 18px;

            font-size: 14px;

            color: #dfe6ff;
        }

        .password-box {
    position: relative;
    width: 100%;
}

.password-box input {
    padding-right: 50px;
}

.password-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);

    width: 38px;
    height: 38px;

    padding: 0;
    margin: 0;

    background: transparent;
    border: none;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.password-toggle:hover {
    background: transparent;
}

.eye-icon {
    width: 20px;
    height: 20px;
    color: #cfd6ff;
}

.eye-slash {
    display: none;
}

.eye-icon.showing .eye-slash {
    display: block;
}

    </style>

</head>


<body>

    <div class="register-box">

        <h1>Teacher Registration</h1>

        <p class="subtitle">
            Create your teacher account
        </p>


        <!-- Registration Form -->

        <form id="teacherRegisterForm">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <div class="password-box">

    <input
        id="password"
        name="password"
        type="password"
        placeholder="Create a password"
        required
    >

    <button
        type="button"
        class="password-toggle"
        onclick="toggleTeacherPassword()"
        aria-label="Show password"
    >
        <svg
    class="eye-icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
>
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
    <circle cx="12" cy="12" r="3"/>
    <line
        class="eye-slash"
        x1="3"
        y1="3"
        x2="21"
        y2="21"
    />
</svg>
    </button>

</div>


            <button type="submit">
                Send OTP
            </button>

        </form>


        <!-- OTP Section -->

        <div id="otpSection">

            <label for="otp">
                Enter OTP
            </label>

            <input
                type="text"
                id="otp"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
            >

            <button onclick="verifyTeacherOTP()">
                Verify & Register
            </button>

        </div>


        <p id="message"></p>

    </div>


<script>

    const form =
        document.getElementById("teacherRegisterForm");

    const otpSection =
        document.getElementById("otpSection");

    const message =
        document.getElementById("message");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        const formData =
            new FormData(form);


        message.textContent =
            "Sending OTP...";


        try {

            const response =
                await fetch("/teacher_register", {

                    method: "POST",

                    body: formData

                });


            const result =
                await response.json();


            message.textContent =
                result.message;


            if (result.success) {

                otpSection.style.display =
                    "block";

            }

        }

        catch (error) {

            message.textContent =
                "Unable to send OTP.";

        }

    });


    async function verifyTeacherOTP() {

        const email =
            document.getElementById("email").value.trim();

        const otp =
            document.getElementById("otp").value.trim();


        if (!otp) {

            message.textContent =
                "Please enter the OTP.";

            return;

        }


        const formData =
            new FormData();


        formData.append(
            "email",
            email
        );

        formData.append(
            "otp",
            otp
        );


        message.textContent =
            "Verifying OTP...";


        try {

            const response =
                await fetch(
                    "/verify_teacher_otp",
                    {

                        method: "POST",

                        body: formData

                    }
                );


            const result =
                await response.json();


            message.textContent =
                result.message;


            if (result.success) {

                form.reset();

                otpSection.style.display =
                    "none";

            }

        }

        catch (error) {

            message.textContent =
                "Unable to verify OTP.";

        }

    }

    function toggleTeacherPassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".password-toggle");

    const eye =
        button.querySelector(".eye-icon");

    if (password.type === "password") {

        password.type = "text";

        eye.classList.add("showing");

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

    } else {

        password.type = "password";

        eye.classList.remove("showing");

        button.setAttribute(
            "aria-label",
            "Show password"
        );
    }
}

</script>

</body>

</html>
